<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasia's Warsaw Adventure 🍀</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999;
}

.button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

#yesBtn{
    background:#ef4444;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    margin-top:20px;
    color:#ffd700;
}
</style>
</head>

<body>

<div id="ui">🍀 0 / 4</div>

<div id="message">
SPACE = Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p>Wanna try avoiding hanging out with Amine?</p>

<button id="yesBtn" class="button">
YES 😏 (for every miss, you owe me a blow job)
</button>

<button id="pubBtn" class="button">
🍀 Walk + Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ground = canvas.height - 180;

// IMAGES

const poznanBg = new Image();
poznanBg.src = "Poznan_bg.png";

const trainBg = new Image();
trainBg.src = "train_bg.png";

const warsawBg = new Image();
warsawBg.src = "warsaw_bg.png";

const pubBg = new Image();
pubBg.src = "pub_bg.png";

const kasia = new Image();
kasia.src = "Kasia_idle1.png";

const amine = new Image();
amine.src = "Amine.png";

const shamrock = new Image();
shamrock.src = "shamrock.png";

const box = new Image();
box.src = "box.png";

// GAME

let chapter = 1;
let score = 0;
let worldX = 0;
let gameEnded = false;
let storyStep = 0;
let trainStoryStep = 0;
const player = {
    x:160,
    y:ground,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:900,collected:false},
    {x:1900,collected:false},
    {x:3200,collected:false},
    {x:4700,collected:false}
];

const boxes = [
    700,
    1500,
    2600,
    3900
];
const poznanMessages = [

"📦 Time to pack for Warsaw...",

"📱 Amine: Ready for Warsaw? 😄",

"🤔 Did I forget something?",

"📱 Amine: Don't miss the train 🚆",

"🍀 Lucky shamrocks might be useful.",

"📱 Amine: And don't forget the shamrocks 🍀",

"🚚 Moving day is finally here!"

];
// JUMP

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space" && !player.jumping){

        player.vy = -24;
        player.jumping = true;

    }

});

// BACKGROUND

function drawBackground(){

    let bg = poznanBg;

    if(chapter===2) bg = trainBg;
    if(chapter===3) bg = warsawBg;
    if(chapter===4) bg = pubBg;

    if(bg.complete){

        ctx.drawImage(
            bg,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

// PLAYER

function drawPlayer(){

    if(!kasia.complete) return;

    ctx.drawImage(
        kasia,
        player.x,
        player.y - 35,
        65,
        85
    );

}

// AMINE

function drawAmine(){

    if(worldX < 5000) return;

    if(!amine.complete) return;

    ctx.drawImage(
        amine,
        canvas.width - 220,
        ground - 45,
        90,
        120
    );

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.collected){

            ctx.drawImage(
                shamrock,
                s.x - worldX,
                ground - 10,
                35,
                35
            );

        }

    });

}

// BOXES

function drawBoxes(){

    boxes.forEach(x=>{

        ctx.drawImage(
            box,
            x - worldX,
            ground + 20,
            45,
            45
        );

    });

}

// UPDATE

function update(){

    if(gameEnded) return;

    worldX += 4;

    player.vy += 0.8;
    player.y += player.vy;

    if(player.y >= ground){

        player.y = ground;
        player.vy = 0;
        player.jumping = false;

    }

    // SHAMROCKS

    shamrocks.forEach(s=>{

        const sx = s.x - worldX;

        if(
            !s.collected &&
            Math.abs(player.x - sx) < 50
        ){

            s.collected = true;
            score++;

const luckyMessages = [

"🍀 Lucky Charm Found!",

"🍀 Warsaw luck increased!",

"🍀 One step closer to the TRUE ENDING!",

"🍀 Nice! Keep collecting them."

];

document.getElementById("message").innerHTML =
luckyMessages[
Math.floor(
Math.random()*luckyMessages.length
)
];


        }

    });

    // SIMPLE BOX COLLISION

    boxes.forEach(x=>{

        const bx = x - worldX;

        const horizontalHit =
            player.x + 45 > bx &&
            player.x < bx + 45;

        const lowEnough =
            player.y > ground - 40;

        if(horizontalHit && lowEnough){

            worldX -= 120;

        }

    });
    if(worldX > 100 && storyStep === 0){

    document.getElementById("message").innerHTML =
    poznanMessages[0];

    storyStep++;

}

if(worldX > 400 && storyStep === 1){

    document.getElementById("message").innerHTML =
    poznanMessages[1];

    storyStep++;

}

if(worldX > 700 && storyStep === 2){

    document.getElementById("message").innerHTML =
    poznanMessages[2];

    storyStep++;

}

if(worldX > 1000 && storyStep === 3){

    document.getElementById("message").innerHTML =
    poznanMessages[3];

    storyStep++;

}

if(worldX > 1300 && storyStep === 4){

    document.getElementById("message").innerHTML =
    poznanMessages[4];

    storyStep++;

}
    if(chapter === 2){

    if(worldX > 1700 && trainStoryStep === 0){

        document.getElementById("message").innerHTML =
        trainMessages[0];

        trainStoryStep++;

    }

    if(worldX > 2000 && trainStoryStep === 1){

        document.getElementById("message").innerHTML =
        trainMessages[1];

        trainStoryStep++;

    }

    if(worldX > 2300 && trainStoryStep === 2){

        document.getElementById("message").innerHTML =
        trainMessages[2];

        trainStoryStep++;

    }

    if(worldX > 2600 && trainStoryStep === 3){

        document.getElementById("message").innerHTML =
        trainMessages[3];

        trainStoryStep++;

    }

}
    document.getElementById("ui").innerHTML =
    "🍀 " + score + " / 4";

    if(worldX > 1500){

    chapter = 2
    document.getElementById("message").innerHTML =
    "🚆 Leaving Poznań for Warsaw!";

}
    if(worldX > 2800) chapter = 3;
    if(worldX > 4300) chapter = 4;

    if(worldX > 5800){

        endGame();

    }

}

// DRAW

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();
    drawShamrocks();
    drawBoxes();
    drawPlayer();
    drawAmine();

}

// END GAME

function endGame(){

    gameEnded = true;

    document.getElementById("ending")
    .style.display = "flex";

}

// LOOP

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

window.onload = ()=>{

    loop();

};

// FUNNY BUTTON

const yesBtn =
document.getElementById("yesBtn");

const speech =
document.getElementById("speech");

function moveButton(){

    const maxX =
    window.innerWidth - 200;

    const maxY =
    window.innerHeight - 100;

    yesBtn.style.position="absolute";

    yesBtn.style.left =
    Math.random()*maxX + "px";

    yesBtn.style.top =
    Math.random()*maxY + "px";

    const jokes = [
        "1 blow job for me 😎",
        "Not that easy huh, another blow job owed😏",
        "The YES button demands a bj toll ",
        "The pub is this way 🍀 wanna sneak in the bathroom? 😈",
        "That's one bj added to the bill 💋",
        "Missed again... that's another bj 🖤",
        "Alternative ending denied, bj added instead 😘",
        "BJ tax has been applied ",
        "Maybe another day, but I demand my bj today ",
        "Current success rate: 0% Current Blow jobs owed: 69",
        "Too slow, come here 🍆",
        "That's another point for Team Blow Job 😂",
        "At some point you will need to give up, but you won't see me complaining tho :3",
        "I bet you're still trying, sorry dear you're just adding the bj counter"
    ];

    speech.innerText =
    jokes[Math.floor(Math.random()*jokes.length)];

}

yesBtn.addEventListener(
"mouseover",
moveButton
);

// TRUE ENDING

document
.getElementById("pubBtn")
.addEventListener("click",()=>{

document.getElementById("ending").innerHTML = `

<h1>🏆 TRUE ENDING</h1>

<h2>One Last Warsaw Adventure</h2>

<img
src="KasiaAmine.png"
style="
width:350px;
max-width:80%;
margin:20px auto;
display:block;
">

<p>✅ Survived Poznań</p>
<p>✅ Reached Warsaw</p>
<p>✅ Collected Shamrocks</p>
<p>✅ Found The Irish Pub</p>
<p>✅ Hung Out With Amine</p>

<br>

<h1> 🖤🖤 </h1>

`;



});

</script>

</body>
</html>
