<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasia's Warsaw Adventure 🍀</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:2;
}

#message{
    position:absolute;
    width:100%;
    top:15px;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:2;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:50;
}

.button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    margin:10px;
    cursor:pointer;
    font-size:20px;
}

#yesBtn{
    background:#ff5757;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    margin-top:15px;
    color:#ffd700;
}
</style>
</head>

<body>

<div id="ui">
🍀 0/4
</div>

<div id="message">
Arrow Keys to Move • Space to Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p style="max-width:700px;margin:20px;">
Would you like to avoid hanging out with Amine?
</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height - 180;

// IMAGES

const kasiaImg = new Image();
kasiaImg.src = "Kasia.png";

const amineImg = new Image();
amineImg.src = "Amine.png";

const poznanBg = new Image();
poznanBg.src = "Poznan_bg.png";

const trainBg = new Image();
trainBg.src = "train_bg.png";

const warsawBg = new Image();
warsawBg.src = "warsaw_bg.png";

const pubBg = new Image();
pubBg.src = "pub_bg.png";

const shamrockImg = new Image();
shamrockImg.src = "shamrock.png";

const boxImg = new Image();
boxImg.src = "box.png";

// GAME STATE

let chapter = 1;
let score = 0;
let worldX = 0;
let gameEnded = false;

const keys = {};

const player = {
    x:180,
    y:groundY,
    w:100,
    h:120,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:1000,collected:false},
    {x:2200,collected:false},
    {x:3400,collected:false},
    {x:4700,collected:false}
];

const obstacles = [
    {x:800},
    {x:1500},
    {x:2800},
    {x:3900}
];

// KEYBOARD

document.addEventListener("keydown",e=>{

    keys[e.code] = true;

    if(e.code==="Space" && !player.jumping){

        player.vy = -18;
        player.jumping = true;

    }

});

document.addEventListener("keyup",e=>{

    keys[e.code] = false;

});

// BACKGROUND

function drawBackground(){

    let bg;

    if(chapter===1) bg = poznanBg;
    else if(chapter===2) bg = trainBg;
    else if(chapter===3) bg = warsawBg;
    else bg = pubBg;

    ctx.drawImage(
        bg,
        0,
        0,
        canvas.width,
        canvas.height
    );

}

// KASIA

function drawPlayer(){

    ctx.drawImage(

        kasiaImg,

        0,
        0,
        313,
        313,

        player.x,
        player.y-40,

        120,
        120

    );

}

// AMINE

function drawAmine(){

    if(chapter >= 3){

        ctx.drawImage(
            amineImg,
            canvas.width-300,
            groundY-60,
            140,
            180
        );

    }

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.collected){

            ctx.drawImage(

                shamrockImg,

                s.x-worldX,
                groundY-70,

                50,
                50

            );

        }

    });

}

// OBSTACLES

function drawObstacles(){

    obstacles.forEach(o=>{

        ctx.drawImage(

            boxImg,

            o.x-worldX,
            groundY,

            70,
            70

        );

    });

}

// UPDATE

function update(){

    if(gameEnded) return;

    if(keys["ArrowRight"]){

        worldX += 7;

    }

    if(keys["ArrowLeft"]){

        worldX -= 7;

        if(worldX < 0)
        worldX = 0;

    }

    player.vy += 0.9;
    player.y += player.vy;

    if(player.y >= groundY){

        player.y = groundY;
        player.vy = 0;
        player.jumping = false;

    }

    for(const s of shamrocks){

        const sx = s.x - worldX;

        if(
            !s.collected &&
            Math.abs(player.x-sx) < 50
        ){

            s.collected = true;
            score++;

        }

    }

    document.getElementById("ui")
    .innerText = `🍀 ${score}/4`;

    if(worldX > 1600 && chapter===1){

        chapter=2;

        document.getElementById("message")
        .innerText =
        "🚆 Travelling To Warsaw";

    }

    if(worldX > 2800 && chapter===2){

        chapter=3;

        document.getElementById("message")
        .innerText =
        "🏙 Welcome To Warsaw";

    }

    if(worldX > 4200 && chapter===3){

        chapter=4;

        document.getElementById("message")
        .innerText =
        "🍀 Find The Irish Pub";

    }

    if(worldX > 5600){

        endGame();

    }

}

// DRAW

function draw(){

    drawBackground();

    drawShamrocks();

    drawPlayer();

    drawAmine();

    drawObstacles();

}

// GAME LOOP

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

// ENDING

function endGame(){

    gameEnded = true;

    document.getElementById("ending")
    .style.display = "flex";

}

// FUNNY BUTTON

const yesBtn = document.getElementById("yesBtn");
const speech = document.getElementById("speech");

function moveButton(){

    const maxX =
    window.innerWidth - 160;

    const maxY =
    window.innerHeight - 100;

    yesBtn.style.position="absolute";

    yesBtn.style.left =
    Math.random()*maxX + "px";

    yesBtn.style.top =
    Math.random()*maxY + "px";

    const jokes = [
        "Nice try 😂",
        "Not that easy 😏",
        "The pub is this way 🍀",
        "Current success rate: 0%",
        "Amine used Quick Attack!"
    ];

    speech.innerText =
    jokes[Math.floor(
    Math.random()*jokes.length
    )];

}

yesBtn.addEventListener(
"mouseover",
moveButton
);

// TRUE ENDING

document
.getElementById("pubBtn")
.addEventListener("click",()=>{

document.getElementById("ending")
.innerHTML = `

<h1>🏆 TRUE ENDING</h1>

<h2>🍀 Kasia's Warsaw Adventure</h2>

<br>

<p>✅ Survived Poznań</p>
<p>✅ Travelled By Train</p>
<p>✅ Explored Warsaw</p>
<p>✅ Collected Shamrocks</p>
<p>✅ Found The Irish Pub</p>
<p>✅ Hung Out With Amine</p>

<br>

<h1>See You Soon Kasia ❤️</h1>

`;

});

</script>

</body>
</html>
