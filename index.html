<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasia's Warsaw Adventure 🍀</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

</style>
</head>

<body>

<div id="ui">🍀 0/4</div>

<div id="message">
← → Move | SPACE Jump
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ground = canvas.height - 160;

// IMAGES

const bgPoznan = new Image();
bgPoznan.src = "Poznan_bg.png";

const bgTrain = new Image();
bgTrain.src = "train_bg.png";

const bgWarsaw = new Image();
bgWarsaw.src = "warsaw_bg.png";

const bgPub = new Image();
bgPub.src = "pub_bg.png";

const kasia = new Image();
kasia.src = "Kasia_idle.png";

const amine = new Image();
amine.src = "Amine.png";

const shamrock = new Image();
shamrock.src = "shamrock.png";

const box = new Image();
box.src = "box.png";

// GAME STATE

let chapter = 1;
let score = 0;
let worldX = 0;

const keys = {};

const player = {
    x:150,
    y:ground,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:1000,taken:false},
    {x:2200,taken:false},
    {x:3500,taken:false},
    {x:5000,taken:false}
];

document.addEventListener("keydown",e=>{

    keys[e.code]=true;

    if(e.code==="Space" && !player.jumping){

        player.vy = -18;
        player.jumping = true;

    }

});

document.addEventListener("keyup",e=>{

    keys[e.code]=false;

});

// BACKGROUND

function drawBackground(){

    let bg = bgPoznan;

    if(chapter===2) bg=bgTrain;
    if(chapter===3) bg=bgWarsaw;
    if(chapter===4) bg=bgPub;

    if(bg.complete){

        ctx.drawImage(
            bg,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

// PLAYER

function drawPlayer(){

    if(!kasia.complete) return;

    ctx.drawImage(
        kasia,
        player.x,
        player.y - 120,
        140,
        180
    );

}

// AMINE

function drawAmine(){

    if(chapter < 3) return;

    if(!amine.complete) return;

    ctx.drawImage(
        amine,
        canvas.width - 260,
        ground - 120,
        160,
        200
    );

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.taken){

            ctx.drawImage(
                shamrock,
                s.x - worldX,
                ground - 40,
                40,
                40
            );

        }

    });

}

// BOXES

function drawBoxes(){

    const boxes = [900,1800,3000,4200];

    boxes.forEach(x=>{

        ctx.drawImage(
            box,
            x-worldX,
            ground,
            60,
            60
        );

    });

}

// UPDATE

function update(){

    if(keys["ArrowRight"])
        worldX += 8;

    if(keys["ArrowLeft"])
        worldX = Math.max(0,worldX-8);

    player.vy += 0.9;
    player.y += player.vy;

    if(player.y >= ground){

        player.y = ground;
        player.vy = 0;
        player.jumping = false;

    }

    shamrocks.forEach(s=>{

        const sx = s.x - worldX;

        if(
            !s.taken &&
            Math.abs(player.x-sx) < 60
        ){

            s.taken = true;
            score++;

        }

    });

    document.getElementById("ui").innerHTML =
    "🍀 " + score + "/4";

    if(worldX > 1500)
        chapter = 2;

    if(worldX > 3000)
        chapter = 3;

    if(worldX > 4500)
        chapter = 4;

}

// DRAW

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawShamrocks();

    drawBoxes();

    drawPlayer();

    drawAmine();

}

// LOOP

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

window.onload = ()=>{

    loop();

};

</script>

</body>
</html>
