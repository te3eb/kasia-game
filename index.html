<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasia's Warsaw Adventure 🍀</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    text-align:center;
}

.button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

#yesBtn{
    background:#ef4444;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    color:#ffd700;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="ui">🍀 0 / 4</div>

<div id="message">
SPACE = Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p>Would you like to avoid hanging out with Amine?</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Walk + Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ground = canvas.height - 180;

// IMAGES

const poznanBg = new Image();
poznanBg.src = "Poznan_bg.png";

const trainBg = new Image();
trainBg.src = "train_bg.png";

const warsawBg = new Image();
warsawBg.src = "warsaw_bg.png";

const pubBg = new Image();
pubBg.src = "pub_bg.png";

const kasia = new Image();
kasia.src = "Kasia_idle1.png";

const amine = new Image();
amine.src = "Amine.png";

const shamrock = new Image();
shamrock.src = "shamrock.png";

const box = new Image();
box.src = "box.png";

// GAME

let chapter = 1;
let score = 0;
let worldX = 0;
let gameEnded = false;

const player = {
    x:160,
    y:ground,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:900,collected:false},
    {x:1900,collected:false},
    {x:3200,collected:false},
    {x:4700,collected:false}
];

const boxes = [
    700,
    1500,
    2600,
    3900
];

// JUMP

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space" && !player.jumping){

        player.vy = -22;
        player.jumping = true;

    }

});

// BACKGROUND

function drawBackground(){

    let bg = poznanBg;

    if(chapter===2) bg = trainBg;
    if(chapter===3) bg = warsawBg;
    if(chapter===4) bg = pubBg;

    if(bg.complete){

        ctx.drawImage(
            bg,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

// PLAYER

function drawPlayer(){

    if(!kasia.complete) return;

    ctx.drawImage(
        kasia,
        player.x,
        player.y - 70,
        80,
        110
    );

}

// AMINE

function drawAmine(){

    if(worldX < 5000) return;

    if(!amine.complete) return;

    ctx.drawImage(
        amine,
        canvas.width - 220,
        ground - 70,
        100,
        140
    );

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.collected){

            ctx.drawImage(
                shamrock,
                s.x-worldX,
                ground - 15,
                40,
                40
            );

        }

    });

}

// BOXES

function drawBoxes(){

    boxes.forEach(x=>{

        ctx.drawImage(
            box,
            x-worldX,
            ground + 10,
            50,
            50
        );

    });

}

// UPDATE

function update(){

    if(gameEnded) return;

    worldX += 4;

    player.vy += 0.8;
    player.y += player.vy;

    if(player.y >= ground){

        player.y = ground;
        player.vy = 0;
        player.jumping = false;

    }

    shamrocks.forEach(s=>{

        const sx = s.x - worldX;

        if(
            !s.collected &&
            Math.abs(player.x - sx) < 60
        ){

            s.collected = true;
            score++;

        }

    });

    // BOX COLLISIONS

    boxes.forEach(x=>{

        const bx = x - worldX;

        const touching =
            player.x + 55 > bx &&
            player.x < bx + 50;

        const tooLow =
            player.y > ground - 55;

        if(touching && tooLow){

            worldX -= 120;

        }

    });
