<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasia's Warsaw Adventure 🍀</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:2;
}

#message{
    position:absolute;
    width:100%;
    top:15px;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:2;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:50;
}

.button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    margin:10px;
    cursor:pointer;
    font-size:20px;
}

#yesBtn{
    background:#ff5757;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    margin-top:15px;
    color:#ffd700;
}
</style>
</head>

<body>

<div id="ui">
🍀 0/4
</div>

<div id="message">
Arrow Keys to Move • Space to Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p style="max-width:700px;margin:20px;">
Would you like to avoid hanging out with Amine?
</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

    }

    let bg;

    else if(chapter===3) bg = warsawBg;
    else bg = pubBg;

    ctx.drawImage(
        bg,
        0,
        0,
        canvas.width,
        canvas.height
    );

}

    );

}

        );

}
