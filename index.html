<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasia's Warsaw Adventure 🍀</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#message{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:99;
}

.button{
    padding:15px 25px;
    font-size:20px;
    border:none;
    border-radius:10px;
    margin:10px;
    cursor:pointer;
}

#yesBtn{
    background:#ef4444;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    margin-top:20px;
    color:#ffd700;
}

</style>
</head>

<body>

<div id="ui">🍀 0/4</div>

<div id="message">
SPACE = Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p>Would you like to avoid hanging out with Amine?</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Walk + Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ground = canvas.height - 160;

// IMAGES

const bgPoznan = new Image();
bgPoznan.src = "Poznan_bg.png";

const bgTrain = new Image();
bgTrain.src = "train_bg.png";

const bgWarsaw = new Image();
bgWarsaw.src = "warsaw_bg.png";

const bgPub = new Image();
bgPub.src = "pub_bg.png";

const kasia = new Image();
kasia.src = "Kasia_idle.png";

const amine = new Image();
amine.src = "Amine.png";

const shamrock = new Image();
shamrock.src = "shamrock.png";

const box = new Image();
box.src = "box.png";

// GAME

let worldX = 0;
let chapter = 1;
let score = 0;
let gameEnded = false;

const player = {
    x:150,
    y:ground,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:900,taken:false},
    {x:2000,taken:false},
    {x:3300,taken:false},
    {x:4700,taken:false}
];

const boxes = [
    700,
    1500,
    2800,
    4100
];

// JUMP

document.addEventListener("keydown",e=>{

    if(e.code==="Space" && !player.jumping){

        player.vy = -18;
        player.jumping = true;

    }

});

// BACKGROUND

function drawBackground(){

    let bg = bgPoznan;

    if(chapter===2) bg = bgTrain;
    if(chapter===3) bg = bgWarsaw;
    if(chapter===4) bg = bgPub;

    if(bg.complete){

        ctx.drawImage(
            bg,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

// PLAYER

function drawPlayer(){

    if(!kasia.complete) return;

    ctx.drawImage(
        kasia,
        player.x,
        player.y - 140,
        120,
        160
    );

}

// AMINE

function drawAmine(){

    if(chapter < 3) return;

    if(!amine.complete) return;

    ctx.drawImage(
        amine,
        canvas.width - 260,
        ground - 120,
        160,
        200
    );

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.taken){

            ctx.drawImage(
                shamrock,
                s.x-worldX,
                ground-30,
                40,
                40
            );

        }

    });

}

// BOXES

function drawBoxes(){

    boxes.forEach(x=>{

        ctx.drawImage(
            box,
            x-worldX,
            ground,
            60,
            60
        );

    });

}

// UPDATE

function update(){

    if(gameEnded) return;

    worldX += 4;

    player.vy += 0.9;
    player.y += player.vy;

    if(player.y >= ground){

        player.y = ground;
        player.vy = 0;
        player.jumping = false;

    }

    shamrocks.forEach(s=>{

        const sx = s.x-worldX;

        if(
            !s.taken &&
            Math.abs(player.x-sx) < 50
        ){

            s.taken = true;
            score++;

        }

    });

    document.getElementById("ui").innerHTML =
    "🍀 " + score + "/4";

    if(worldX > 1500) chapter = 2;
    if(worldX > 2800) chapter = 3;
    if(worldX > 4200) chapter = 4;

    if(worldX > 5600){

        endGame();

    }

}

// DRAW

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawShamrocks();

    drawBoxes();

    drawPlayer();

    drawAmine();

}

// END GAME

function endGame(){

    gameEnded = true;

    document.getElementById("ending")
    .style.display = "flex";

}

// LOOP

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

window.onload = ()=>{

    loop();

};

// FUNNY BUTTON

const yesBtn =
document.getElementById("yesBtn");

const speech =
document.getElementById("speech");

function moveButton(){

    const maxX =
    window.innerWidth - 200;

    const maxY =
    window.innerHeight - 100;

    yesBtn.style.position="absolute";

    yesBtn.style.left =
    Math.random()*maxX + "px";

    yesBtn.style.top =
    Math.random()*maxY + "px";

    const jokes = [
        "Nice try 😂",
        "The pub is this way 🍀",
        "Not so fast 😏",
        "Current success rate: 0%",
        "Amine used Quick Attack!"
    ];

    speech.innerText =
    jokes[Math.floor(Math.random()*jokes.length)];

}

yesBtn.addEventListener(
"mouseover",
moveButton
);

// TRUE ENDING

document
.getElementById("pubBtn")
.addEventListener("click",()=>{

document.getElementById("ending").innerHTML=`

<h1>🏆 TRUE ENDING</h1>

<h2>One Last Warsaw Adventure</h2>

<br>

<p>✅ Survived Poznań</p>
<p>✅ Travelled To Warsaw</p>
<p>✅ Collected Shamrocks</p>
<p>✅ Found The Irish Pub</p>
<p>✅ Hung Out With Amine</p>

<br>

<h1>See You Soon Kasia ❤️</h1>

`;

});

</script>

</body>
</html>
