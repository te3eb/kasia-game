<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasia's Warsaw Adventure 🍀</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    text-align:center;
}

.button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

#yesBtn{
    background:#ef4444;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    color:#ffd700;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="ui">🍀 0 / 4</div>

<div id="message">
SPACE = Jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p>Would you like to avoid hanging out with Amine?</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Walk + Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ground = canvas.height - 180;

// IMAGES

const poznanBg = new Image();
poznanBg.src = "Poznan_bg.png";

const trainBg = new Image();
trainBg.src = "train_bg.png";

const warsawBg = new Image();
warsawBg.src = "warsaw_bg.png";

const pubBg = new Image();
pubBg.src = "pub_bg.png";

const kasia = new Image();
kasia.src = "Kasia_idle1.png";

const amine = new Image();
amine.src = "Amine.png";

const shamrock = new Image();
shamrock.src = "shamrock.png";

const box = new Image();
box.src = "box.png";

// GAME STATE

let chapter = 1;
let score = 0;
let worldX = 0;
let gameEnded = false;

const player = {
    x:160,
    y:ground,
    vy:0,
    jumping:false
};

const shamrocks = [
    {x:900,collected:false},
    {x:1900,collected:false},
    {x:3200,collected:false},
    {x:4700,collected:false}
];

const boxes = [
    700,
    1500,
    2600,
    3900
];

// JUMP

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space" && !player.jumping){

        player.vy = -18;
        player.jumping = true;

    }

});

// BACKGROUND

function drawBackground(){

    let bg = poznanBg;

    if(chapter===2) bg = trainBg;
    if(chapter===3) bg = warsawBg;
    if(chapter===4) bg = pubBg;

    if(bg.complete){

        ctx.drawImage(
            bg,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

// PLAYER

function drawPlayer(){

    if(!kasia.complete) return;

    ctx.drawImage(
        kasia,
        player.x,
        player.y - 95,
        90,
        120
    );

}

// AMINE

function drawAmine(){

    if(worldX < 5000) return;

    if(!amine.complete) return;

    ctx.drawImage(
        amine,
        canvas.width - 220,
        ground - 85,
        100,
        135
    );

}

// SHAMROCKS

function drawShamrocks(){

    shamrocks.forEach(s=>{

        if(!s.collected){

            ctx.drawImage(
                shamrock,
                s.x - worldX,
                ground - 30,
                40,
                40
            );

        }

    });

}

// BOXES

function drawBoxes(){

    boxes.forEach(x=>{

        ctx.drawImage(
            box,
            x - worldX,
            ground,
            65,
            65
        );

    });

}

// UPDATE

function update(){

    if(gameEnded) return;

    worldX += 4;

    player.vy += 0.9;
    player.y += player.vy;

    if(player.y >= ground){

        player.y = ground;
        player.vy = 0;
        player.jumping = false;

    }

    // SHAMROCKS

    shamrocks.forEach(s=>{

        const sx = s.x - worldX;

        if(
            !s.collected &&
            Math.abs(player.x - sx) < 60
        ){
            s.collected = true;
            score++;
        }

    });

    // BOX COLLISION

    boxes.forEach(x=>{

        const bx = x - worldX;

        const colliding =
            player.x + 75 > bx &&
            player.x < bx + 65 &&
            player.y > ground - 60;

        if(colliding){

            worldX -= 150;

        }

    });

    document.getElementById("ui").innerHTML =
    "🍀 " + score + " / 4";

    if(worldX > 1500) chapter = 2;
    if(worldX > 2800) chapter = 3;
    if(worldX > 4300) chapter = 4;

    if(worldX > 5800){

        endGame();

    }

}

// DRAW

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();
    drawShamrocks();
    drawBoxes();
    drawPlayer();
    drawAmine();

}

// ENDING

function endGame(){

    gameEnded = true;

    document.getElementById("ending")
    .style.display = "flex";

}

// LOOP

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);

}

window.onload = ()=>{

    gameLoop();

};

// FUNNY BUTTON

const yesBtn = document.getElementById("yesBtn");
const speech = document.getElementById("speech");

function moveButton(){

    const maxX = window.innerWidth - 200;
    const maxY = window.innerHeight - 100;

    yesBtn.style.position = "absolute";
    yesBtn.style.left = Math.random()*maxX + "px";
    yesBtn.style.top = Math.random()*maxY + "px";

    const jokes = [
        "Nice try 😂",
        "Not that easy 😏",
        "The pub is this way 🍀",
        "Current success rate: 0%",
        "Amine used Quick Attack!"
    ];

    speech.innerText =
    jokes[Math.floor(Math.random()*jokes.length)];

}

yesBtn.addEventListener("mouseover",moveButton);

// TRUE ENDING

document.getElementById("pubBtn")
.addEventListener("click",()=>{

document.getElementById("ending").innerHTML = `

<h1>🏆 TRUE ENDING</h1>

<h2>One Last Warsaw Adventure</h2>

<p>✅ Survived Poznań</p>
<p>✅ Reached Warsaw</p>
<p>✅ Collected Shamrocks</p>
<p>✅ Found The Irish Pub</p>
<p>✅ Hung Out With Amine</p>

<br>

<h1>See you soon Kasia ❤️</h1>

`;

});

</script>

</body>
</html>
