<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kasia's Warsaw Adventure 🍀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    width:100%;
    text-align:center;
    top:70px;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:10;
    color:white;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

#ending h1{
    margin-bottom:15px;
}

.button{
    padding:15px 25px;
    margin:12px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#yesBtn{
    background:#ff5757;
    color:white;
}

#pubBtn{
    background:#22c55e;
    color:white;
}

#speech{
    margin-top:10px;
    color:#ffd700;
}

</style>
</head>
<body>

<div id="ui">
Chapter 1: Poznań
</div>

<div id="message">
Use SPACE to jump
</div>

<div id="ending">

<h1>🎉 You Made It To Warsaw!</h1>

<p style="max-width:700px;margin-bottom:25px;">
Would you like to avoid hanging out with Amine?
</p>

<button id="yesBtn" class="button">
YES 😏
</button>

<button id="pubBtn" class="button">
🍀 Walk + Irish Pub
</button>

<div id="speech"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height - 130;

let chapter = 1;
let gameEnded = false;

const player = {
    x:120,
    y:groundY,
    w:40,
    h:60,
    vy:0,
    jumping:false
};

const obstacles = [
    {x:700,type:"box"},
    {x:1100,type:"box"},
    {x:1600,type:"box"},
    {x:2400,type:"paper"},
    {x:2900,type:"paper"},
    {x:3400,type:"paper"},
];

let worldX = 0;

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space" && !player.jumping){
        player.vy=-18;
        player.jumping=true;
    }

});

function drawBackground(){

    if(chapter===1){

        ctx.fillStyle="#7dd3fc";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="#22c55e";
        ctx.fillRect(0,groundY+60,canvas.width,200);

        ctx.fillStyle="#ef4444";
        ctx.fillRect(80,250,100,100);

        ctx.fillStyle="#f97316";
        ctx.fillRect(240,220,100,130);

        document.getElementById("ui").innerText =
        "Chapter 1: Poznań 📦";
    }

    else if(chapter===2){

        ctx.fillStyle="#60a5fa";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="#6b7280";
        ctx.fillRect(0,groundY+60,canvas.width,200);

        ctx.fillStyle="#374151";
        ctx.fillRect(0,groundY+20,canvas.width,20);

        document.getElementById("ui").innerText =
        "Chapter 2: Train To Warsaw 🚆";
    }

    else if(chapter===3){

        ctx.fillStyle="#38bdf8";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="#15803d";
        ctx.fillRect(0,groundY+60,canvas.width,200);

        ctx.fillStyle="#64748b";

        ctx.fillRect(100,180,80,200);
        ctx.fillRect(230,130,120,250);
        ctx.fillRect(430,170,100,210);

        document.getElementById("ui").innerText =
        "Chapter 3: Warsaw 🏙";
    }

    else{

        const grd = ctx.createLinearGradient(0,0,0,canvas.height);

        grd.addColorStop(0,"#1e1b4b");
        grd.addColorStop(1,"#312e81");

        ctx.fillStyle=grd;
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="#f59e0b";

        ctx.fillRect(
            canvas.width-250,
            groundY-120,
            150,
            120
        );

        ctx.fillStyle="white";
        ctx.font="28px Arial";
        ctx.fillText("🍀 Irish Pub",canvas.width-260,groundY-140);

        document.getElementById("ui").innerText =
        "Final Chapter: Irish Pub 🍀";
    }
}

function drawPlayer(){

    ctx.fillStyle="#ec4899";

    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    ctx.fillStyle="#fde68a";

    ctx.fillRect(
        player.x+5,
        player.y-20,
        30,
        25
    );
}

function drawObstacle(o){

    const screenX = o.x - worldX;

    if(o.type==="box"){
        ctx.fillStyle="#8b5a2b";
        ctx.fillRect(screenX,groundY+15,50,50);

        ctx.fillStyle="white";
        ctx.fillText("📦",screenX+8,groundY+50);
    }

    if(o.type==="paper"){
        ctx.fillStyle="white";
        ctx.fillRect(screenX,groundY+10,45,55);

        ctx.fillStyle="black";
        ctx.fillText("📝",screenX+5,groundY+48);
    }
}

function update(){

    if(gameEnded) return;

    worldX += 4;

    player.vy += 0.9;
    player.y += player.vy;

    if(player.y >= groundY){
        player.y = groundY;
        player.vy = 0;
        player.jumping = false;
    }

    for(const o of obstacles){

        const ox = o.x - worldX;

        if(
            player.x < ox+45 &&
            player.x+player.w > ox &&
            player.y+player.h > groundY+10
        ){
            worldX -= 50;
        }
    }

    if(worldX > 1800 && chapter===1){

        chapter=2;

        document.getElementById("message").innerText =
        "🚆 Traveling from Poznań to Warsaw!";
    }

    if(worldX > 2200 && chapter===2){

        chapter=3;

        document.getElementById("message").innerText =
        "🏙 Welcome to Warsaw!";
    }

    if(worldX > 4000 && chapter===3){

        chapter=4;

        document.getElementById("message").innerText =
        "🍀 Find the Legendary Irish Pub!";
    }

    if(worldX > 5200){

        endGame();
    }
}

function draw(){

    drawBackground();

    ctx.fillStyle="#444";
    ctx.fillRect(
        0,
        groundY+60,
        canvas.width,
        8
    );

    drawPlayer();

    obstacles.forEach(drawObstacle);
}

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(gameLoop);
}

function endGame(){

    gameEnded = true;

    document.getElementById("ending")
    .style.display = "flex";
}

gameLoop();

const yesBtn =
document.getElementById("yesBtn");

const speech =
document.getElementById("speech");

function moveButton(){

    const maxX =
    window.innerWidth - 150;

    const maxY =
    window.innerHeight - 100;

    yesBtn.style.position="absolute";
    yesBtn.style.left=
    Math.random()*maxX + "px";

    yesBtn.style.top=
    Math.random()*maxY + "px";

    const jokes = [
        "Nice try 😂",
        "Not that easy 😏",
        "Almost!",
        "The pub is this way 🍀",
        "Error 404: Alternative ending not found.",
        "Amine used Quick Attack!",
        "Current success rate: 0%"
    ];

    speech.innerText =
    jokes[Math.floor(Math.random()*jokes.length)];
}

yesBtn.addEventListener(
"mouseover",
moveButton
);

yesBtn.addEventListener(
"touchstart",
moveButton
);

document
.getElementById("pubBtn")
.addEventListener("click",()=>{

document.getElementById("ending").innerHTML=`

<h1>🏆 TRUE ENDING</h1>

<h2>One Last Warsaw Adventure</h2>

<br>

<p>✅ Survived packing in Poznań</p>
<p>✅ Relocated to Warsaw</p>
<p>✅ Explored the city</p>
<p>✅ Found the Irish Pub</p>
<p>✅ Hung out with Amine</p>

<br>

<h2>🚶 + 🍀</h2>

<p>
Walk around Kinoteka<br>
then Irish Pub
</p>

<br>

<h1>See you soon, Kasia ❤️</h1>
`;
});

</script>

</body>
</html>
